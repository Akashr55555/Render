services:
  - type: web
    name: pdfsketch
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      # Optional secrets that can be configured in Render dashboard
      # - key: GEMINI_API_KEY
      #   sync: false
      # - key: STRIPE_SECRET_KEY
      #   sync: false
      # - key: STRIPE_WEBHOOK_SECRET
      #   sync: false
      # - key: FIREBASE_SERVICE_ACCOUNT_JSON
      #   sync: false
